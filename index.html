<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>סל חכם</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <p class="brand">סל חכם</p>
  </header>

  <main>
    <section id="screen-build" class="screen" aria-labelledby="build-title">
      <h1 id="build-title">בניית הסל</h1>
      <p class="subtitle">בחרו מוצרים וקבעו כמות לכל מוצר</p>

      <div class="filters" role="group" aria-label="חיפוש וסינון לפי קטגוריה">
      <div class="toolbar">
        <div class="search">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="M20 20l-4-4" />
          </svg>
          <label for="search" class="visually-hidden">חיפוש מוצר</label>
          <input id="search" type="search" placeholder="חיפוש מוצר..." autocomplete="off">
        </div>

        <div id="categories-top" class="categories"></div>
      </div>
      <div id="categories-bottom" class="categories categories-bottom"></div>
      </div>

      <h2 id="products-title">מוצרים</h2>
      <p id="products-status" class="note" aria-live="polite"></p>
      <ul id="products" class="list products" aria-labelledby="products-title"></ul>

      <h2 id="basket-title">הסל שלי (0 מוצרים)</h2>
      <p id="basket-empty" class="note">הסל ריק. הוסיפו מוצרים מהרשימה.</p>
      <ul id="basket" class="list" aria-labelledby="basket-title"></ul>

      <div class="actions">
        <button id="btn-compare" type="button" class="btn-primary" disabled>השווה (סל ריק)</button>
        <p id="compare-msg" class="note center" aria-live="polite"></p>
        <p class="note center">הסל נשמר בדפדפן</p>
      </div>
    </section>
  </main>

  <p id="announcer" class="visually-hidden" aria-live="polite"></p>

  <script type="module" src="js/app.js"></script>
</body>
</html>
